embedding_dir: data/processed/embeddings/mobio/buffalo_l_yunet
results_dir: results/mobio_shuffled_record_control
template_dim: 128
protection:
  scheme: biohash
primary_analysis: descriptive_control
control_name: one identity-correct anchor plus shuffled non-anchor records
record_control: shuffle_non_anchor
split_reassignment_seed: 90737
key_seed: 90749
set_seed: 90761
repeats_per_identity: 8
exposures: [1, 10]
conditions:
