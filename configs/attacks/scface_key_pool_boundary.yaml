classification: exploratory independent study, not benchmark_cb reproduction
dataset: SCface visible mugshot gallery and 21 visible surveillance exposures, 130 identities, identity-disjoint 78/26/26 protocol
embedding_dir: data/processed/embeddings/scface_multiexposure/buffalo_l_yunet
results_dir: results/scface_key_pool_boundary
template_dim: 128
protection:
  scheme: biohash
primary_analysis: key_pool_boundary
key_seed: 91897
set_seed: 91903
repeats_per_identity: 8
exposures: [1, 10]
conditions:
  - random_key_pool_1
  - random_key_pool_2
  - random_key_pool_3
  - random_key_pool_4
  - random_key_pool_5
  - random_key_pool_7
  - random_key_pool_10
  - independent_unseen_keys
models:
  - mean_mlp
amplification_threshold: 0.05
training:
  seeds: [457, 467, 477]
  epochs: 400
  patience: 60
  hidden_dim: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  mse_weight: 0.1
  bootstrap_resamples: 2000
  bootstrap_confidence: 0.95
