[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biometrics-ai"
version = "0.1.0"
description = "Reproducible research infrastructure for protected face-template leakage"
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.26",
	"torch>=2.2,<2.9; platform_system == 'Windows'",
	"torch>=2.2; platform_system != 'Windows'",
	"scikit-learn>=1.4",
	"PyYAML>=6.0",
	"Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
face = ["insightface>=0.7", "onnxruntime>=1.17", "opencv-python>=4.9"]
figures = ["matplotlib>=3.8", "pandas>=2.0"]
presentation = ["matplotlib>=3.8", "pandas>=2.0", "python-pptx>=1.0,<2", "pypdfium2>=4,<6", "pypdf>=5,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
